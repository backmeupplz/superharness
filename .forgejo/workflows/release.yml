name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Build matrix ─────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            use_cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            use_cross: false

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      # The macOS runners are a shared Mac: Homebrew's own `rust` puts a cargo/rustc without the
      # x86_64 std in /opt/homebrew/bin ("can't find crate for core"), so put rustup's proxies
      # first; and both jobs run as one user, so each target gets its own rustup home to keep
      # concurrent toolchain installs from colliding. The Mac keeps its home between jobs, so
      # each target also keeps its target dir and reuses the dependency builds of earlier releases.
      - name: Use rustup's toolchain on the shared Mac
        if: runner.os == 'macOS'
        run: |
          echo "$(dirname "$(realpath "$(command -v rustup)")")" >> "$GITHUB_PATH"
          echo "RUSTUP_HOME=$HOME/.rustup-${{ matrix.target }}" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$HOME/.cache/release-target/superharness-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # cross needs a Docker daemon that can bind-mount the workspace, which these jobs don't have.
      # Its aarch64 image is Ubuntu 24.04 with Ubuntu's aarch64-linux-gnu toolchain, so install the
      # same packages here and set the same variables (same glibc 2.39 baseline as before).
      - name: Install aarch64 cross toolchain
        if: matrix.use_cross
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      # Linux jobs start from a fresh container: restore the registry and dependency builds of the last
      # release (actions/cache would upload from the Mac over its slow uplink; its home persists anyway)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: runner.os == 'Linux'
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          BIN="${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/release/superharness"
          ASSET="superharness-${{ matrix.target }}"

          cp "$BIN" "$ASSET"

          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
          fi

          echo "ASSET=${ASSET}" >> "$GITHUB_ENV"

          # The Mac's uplink is slow: xz cuts the upload by a third against the artifact zip; publish unpacks it
          if [ "$RUNNER_OS" = macOS ]; then
            COPYFILE_DISABLE=1 tar --options xz:compression-level=9 -cJf "$ASSET.tar.xz" "$ASSET" "$ASSET.sha256"
            rm "$ASSET" "$ASSET.sha256"
          fi

      - name: Build .deb package (Linux only)
        if: contains(matrix.target, 'linux')
        shell: bash
        run: |
          # the job container runs with umask 000: dpkg-deb rejects a world-writable DEBIAN dir, and the package
          # files must keep their usual 755/644 modes
          umask 022
          VERSION="${GITHUB_REF_NAME#v}"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)  DEB_ARCH="amd64" ;;
            aarch64-unknown-linux-gnu) DEB_ARCH="arm64" ;;
          esac

          PKG_DIR="superharness_${VERSION}_${DEB_ARCH}"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin"

          cat > "${PKG_DIR}/DEBIAN/control" <<EOF
          Package: superharness
          Version: ${VERSION}
          Architecture: ${DEB_ARCH}
          Maintainer: Nikita Kolmogorov <ubuntu@borodutch.com>
          Description: Autonomous multi-agent orchestrator for AI coding
           CLI tool that orchestrates AI coding agents via tmux panes,
           enabling parallel multi-agent workflows with worktree isolation.
          Homepage: https://github.com/backmeupplz/superharness
          Depends: tmux
          Section: utils
          Priority: optional
          EOF
          sed -i 's/^          //' "${PKG_DIR}/DEBIAN/control"

          cp "target/${{ matrix.target }}/release/superharness" "${PKG_DIR}/usr/bin/superharness"
          dpkg-deb --build "${PKG_DIR}"

      - name: Upload build artifacts
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
            ${{ env.ASSET }}.tar.xz
            *.deb

  # ── GitHub Release (releases don't mirror; installers and Homebrew download from GitHub) ──
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: https://code.forgejo.org/forgejo/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release and attach assets to the Forgejo release
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          FJ_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          for f in *.tar.xz; do tar -xJf "$f" && rm "$f"; done
          sha256sum -c *.sha256
          # The tag reaches the GitHub mirror within seconds; wait for it rather than letting GitHub create one
          for i in $(seq 30); do gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1 && break; sleep 10; done
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$REPO" --clobber *
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "superharness $TAG" --notes "$NOTES" --generate-notes *
          fi
          for f in *; do
            curl -fsS -o /dev/null -H "Authorization: token $FJ_TOKEN" -F "attachment=@$f" \
              "${{ github.server_url }}/api/v1/repos/$REPO/releases/$RELEASE_ID/assets?name=$f"
          done

  # ── Publish to crates.io (after all builds succeed) ───────────────────────────
  publish-crates:
    name: Publish to crates.io
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

  # ── Homebrew tap (formerly homebrew.yml on workflow_run; chained with needs instead) ──
  update-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Extract version
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download SHA256 files
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          BASE="https://github.com/backmeupplz/superharness/releases/download/$TAG"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            curl -fSL -o "superharness-${target}.sha256" "$BASE/superharness-${target}.sha256"
          done

      - name: Parse SHA256 sums
        id: sha
        run: |
          echo "linux_amd64=$(awk '{print $1}' superharness-x86_64-unknown-linux-gnu.sha256)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(awk '{print $1}' superharness-aarch64-unknown-linux-gnu.sha256)" >> "$GITHUB_OUTPUT"
          echo "macos_amd64=$(awk '{print $1}' superharness-x86_64-apple-darwin.sha256)" >> "$GITHUB_OUTPUT"
          echo "macos_arm64=$(awk '{print $1}' superharness-aarch64-apple-darwin.sha256)" >> "$GITHUB_OUTPUT"

      - name: Clone Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.FJ_PUSH_TOKEN }}
        run: git clone "https://backmeupplz:${TAP_TOKEN}@git.borodutch.com/backmeupplz/homebrew-superharness.git" homebrew-tap

      - name: Generate formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          BASE="https://github.com/backmeupplz/superharness/releases/download/$TAG"

          mkdir -p homebrew-tap/Formula
          cat > homebrew-tap/Formula/superharness.rb <<RUBY
          class Superharness < Formula
            desc "Autonomous multi-agent orchestrator for AI coding agents via tmux"
            homepage "https://github.com/backmeupplz/superharness"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_intel do
                url "$BASE/superharness-x86_64-apple-darwin"
                sha256 "${{ steps.sha.outputs.macos_amd64 }}"
              end
              on_arm do
                url "$BASE/superharness-aarch64-apple-darwin"
                sha256 "${{ steps.sha.outputs.macos_arm64 }}"
              end
            end

            on_linux do
              on_intel do
                url "$BASE/superharness-x86_64-unknown-linux-gnu"
                sha256 "${{ steps.sha.outputs.linux_amd64 }}"
              end
              on_arm do
                url "$BASE/superharness-aarch64-unknown-linux-gnu"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              end
            end

            def install
              bin.install stable.url.split("/").last => "superharness"
            end

            test do
              assert_match "superharness", shell_output("#{bin}/superharness --help")
            end
          end
          RUBY
          sed -i 's/^          //' homebrew-tap/Formula/superharness.rb

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/superharness.rb
          git commit -m "Update superharness to ${{ steps.version.outputs.version }}"
          git push
