name: Publish to PPA

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Unpacking the ~230 packages that devscripts' recommends (lintian and its Perl stack, man-db, ...) pulled in took
      # 8 minutes on the runner's busy disk; debuild -S needs none of them (it skips lintian, whose findings were
      # warnings only and never failed the upload).
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y debhelper devscripts dput
        env:
          # GitHub's image sets this; without it debconf waits for input forever
          DEBIAN_FRONTEND: noninteractive

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate lockfile and vendor dependencies
        run: |
          cargo generate-lockfile
          cargo vendor debian/vendor
          # multi-threaded xz (same format and level); single-threaded it took 4 minutes
          XZ_OPT=-T0 tar cJf debian/vendor.tar.xz -C debian vendor
          rm -rf debian/vendor

      - name: Create orig tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar czf "../superharness_${VERSION}.orig.tar.gz" \
            --exclude='./.git' \
            --exclude='./debian' \
            --exclude='./target' \
            .

      - name: Import GPG key
        if: github.event_name == 'release' # DRYRUN
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "allow-preset-passphrase" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent
          gpgconf --launch gpg-agent
          KEYGRIP=$(gpg --with-keygrip --list-secret-keys "${{ secrets.GPG_KEY_ID }}" | grep Keygrip | head -1 | awk '{print $3}')
          /usr/lib/gnupg/gpg-preset-passphrase --preset --passphrase "${{ secrets.GPG_PASSPHRASE }}" "$KEYGRIP"

      - name: Build and upload source packages
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          GPG_KEY="${{ secrets.GPG_KEY_ID }}"

          for DISTRO in jammy noble; do
            echo "=== Building for $DISTRO ==="

            cat > debian/changelog << CHLOG
          superharness (${VERSION}-1${DISTRO}1) ${DISTRO}; urgency=medium

            * Release ${VERSION}

           -- Nikita Kolmogorov <ubuntu@borodutch.com>  $(date -R)
          CHLOG

            dpkg-source -b .
            debuild -S -sa -d -us -uc # DRYRUN

            echo DRYRUN would dput ppa:borodutch/superharness "../superharness_${VERSION}-1${DISTRO}1_source.changes"
          done
